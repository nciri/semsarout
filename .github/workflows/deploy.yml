name: Deploy prod (co-location Hetzner)

# Déploiement de la production co-localisée (46.62.203.126), déclenché au push sur main.
# main n'avance que par PR develop → main dont la CI (ci.yml) est un check requis :
# arriver ici implique donc « CI verte ». Lancement manuel possible (workflow_dispatch).
#
# Fait : build des 2 fronts sur le runner → rsync du code + des dist vers le serveur →
# réinstall éditable du venv + redémarrage du mesh (infra/prod/deploy-remote.sh).
# Le chemin « serveur dédié Terraform » est abandonné (co-location, cf.
# memory/prod-colocation-tabiblib.md).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 46.62.203.126
  DEPLOY_USER: root
  APP_DIR: /opt/semsar

jobs:
  deploy:
    name: Build + rsync + restart mesh
    runs-on: ubuntu-latest
    # Les secrets (DEPLOY_SSH_PRIVATE_KEY) sont portés par l'environnement `production`.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend semsarout
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build frontend m3a-l3achrane
        working-directory: frontend-m3a-l3achrane
        run: |
          npm ci
          npm run build

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync du code backend
        run: |
          rsync -az --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git' --exclude='node_modules' --exclude='dist' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
            --exclude='venv' --exclude='www' --exclude='*.env' --exclude='.env' \
            --exclude='frontend/' --exclude='frontend-m3a-l3achrane/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"

      - name: Rsync des fronts (dist)
        run: |
          rsync -az --no-perms --no-owner --no-group -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/www/semsarout/"
          rsync -az --no-perms --no-owner --no-group -e "ssh -i ~/.ssh/deploy_key" \
            frontend-m3a-l3achrane/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/www/m3a-l3achrane/"

      - name: Réinstall venv + migrations + restart mesh
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash $APP_DIR/infra/prod/deploy-remote.sh"
