<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{display:flex;width:1280px;height:854px;font-family:var(--font-display)}
  .main{flex:1;background:var(--navy-700);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .wm{color:#fff;font-weight:800;font-size:150px;line-height:1.02;letter-spacing:-0.03em;text-align:center}
  .wm .a{color:var(--gold-500)}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style></head>
<body>
  <div class="tile">
    <div class="main"><div class="wm">M3a<span class="a">·</span>L3chrane</div></div>
    <div class="strip">
      <div style="background:var(--gold-500)"></div>
      <div style="background:var(--green-500)"></div>
      <div style="background:var(--info-500)"></div>
      <div style="background:var(--navy-900)"></div>
    </div>
  </div>
</body></html>
