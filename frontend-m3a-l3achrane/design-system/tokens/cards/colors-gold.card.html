<!-- @dsCard group="Colors" viewport="700x150" name="Gold accent" subtitle="The single warm accent — one per view (S'inscrire, highlights)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-body)}.w{display:flex;padding:20px;gap:0}.s{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box}.s b{font:var(--fw-bold) 11px var(--font-body);color:var(--navy-800)}.s span{font:var(--fw-medium) 10px var(--font-mono);color:var(--navy-800);opacity:.7}</style></head>
<body><div class="w">
<div class="s" style="background:var(--gold-700)"><b>700</b><span>#c98a1e</span></div>
<div class="s" style="background:var(--gold-600)"><b>600 ·hover</b><span>#e0a233</span></div>
<div class="s" style="background:var(--gold-500)"><b>500 ·accent</b><span>#efb24d</span></div>
<div class="s" style="background:var(--gold-400)"><b>400</b><span>#f4c470</span></div>
<div class="s" style="background:var(--gold-200)"><b>200</b><span>#fbe6bd</span></div>
<div class="s" style="background:var(--gold-100)"><b>100</b><span>#fdf3dd</span></div>
</div></body></html>
