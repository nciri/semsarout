<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Green = verified/good only · amber · red · info" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-body)}.w{display:flex;padding:20px;gap:12px}.g{flex:1;display:flex;flex-direction:column;gap:6px}.g .lab{font:var(--fw-bold) 11px var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}.pair{display:flex;gap:6px}.sw{flex:1;height:52px;border-radius:8px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font:var(--fw-semibold) 10px var(--font-mono)}</style></head>
<body><div class="w">
<div class="g"><div class="lab">Verified</div><div class="pair"><div class="sw" style="background:var(--green-500);color:#fff">#2bb673</div><div class="sw" style="background:var(--green-100);color:var(--green-700)">100</div></div></div>
<div class="g"><div class="lab">Warning</div><div class="pair"><div class="sw" style="background:var(--amber-500);color:#fff">#e79b2b</div><div class="sw" style="background:var(--amber-100);color:var(--gold-700)">100</div></div></div>
<div class="g"><div class="lab">Danger</div><div class="pair"><div class="sw" style="background:var(--red-600);color:#fff">#d64545</div><div class="sw" style="background:var(--red-100);color:var(--red-600)">100</div></div></div>
<div class="g"><div class="lab">Info</div><div class="pair"><div class="sw" style="background:var(--info-500);color:#fff">#3b7fd4</div><div class="sw" style="background:var(--info-100);color:var(--info-500)">100</div></div></div>
</div></body></html>
