<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Repli explicite : sans ce lien, le navigateur demande /favicon.ico à la racine du
         site. semsarout.com étant co-hébergé avec tabiblib, c'est l'icône de CE dernier qui
         était servie — d'où une favicon étrangère au projet. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- viewport-fit=cover : l'éditeur de plan passe en plein écran sur tablette,
         le canevas doit pouvoir occuper les zones sous encoche/arrondis. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SemsarOut" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Semsar - Le portail immobilier du Maroc. Trouvez votre bien immobilier : appartements, maisons, villas, terrains à vendre ou à louer." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Kaushan+Script&display=swap" rel="stylesheet">
    <title>Semsar - Immobilier au Maroc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
