# Infra plateforme v2 — composants conteneurisés UNIQUEMENT.
# PostgreSQL est NATIF (cf. ADR-0002) — ne JAMAIS l'ajouter ici.
# Redis reste géré par le docker-compose.yml racine (port 6379).
name: semsar-platform

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: semsar-rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-semsar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-semsar}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: semsar-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-semsar}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-semsar-secret}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: semsar-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
      - "8889:8889"      # Prometheus exporter (métriques des traces)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: semsar-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: semsar-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: semsar-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true          # dev uniquement (pas d'auth sur :9200)
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Semsar_dev_2026!
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: semsar-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:
  opensearch_data:
