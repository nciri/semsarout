receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Métriques RED dérivées, exposées à Prometheus
  prometheus:
    endpoint: 0.0.0.0:8889
  # Backend de traces : sans lui les spans n'allaient que sur stdout du collecteur.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki ingère l'OTLP nativement depuis la 3.x ; sans ça il restait vide.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
