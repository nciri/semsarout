[defaults]
# Pas d'inventaire par défaut : deploy.yml en génère un (IP Terraform) et le passe
# toujours via -i. host_key_checking désactivé côté CI (ANSIBLE_HOST_KEY_CHECKING
# déjà posé par deploy.yml) ; répété ici pour les exécutions locales/manuelles.
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
