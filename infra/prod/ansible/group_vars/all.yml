---
# Variables non sensibles du provisioning prod. Les secrets (mots de passe PG,
# RabbitMQ, MinIO, jeton interne) sont générés sur le serveur lui-même par le
# rôle `base` (jamais ici, jamais dans le dépôt).

semsar_app_dir: /opt/semsar/app
semsar_venv_dir: /opt/semsar/venv
semsar_www_dir: /opt/semsar/www
semsar_secrets_file: /etc/semsar/secrets.env
semsar_env_dir: /etc/semsar/env
semsar_user: semsar
semsar_group: semsar

semsar_git_repo: https://github.com/nciri/semsarout.git
semsar_git_branch: main

semsar_db_name: semsar_prod
semsar_pg_version: "16"

# Extra-vars attendues depuis deploy.yml (valeurs par défaut de secours pour
# `--syntax-check` / exécutions locales ; toujours écrasées par --extra-vars en CI).
jwt_secret_key: ""
semsar_domain: semsarout.com
m3a_l3achrane_domain: m3a-l3achrane.ma
letsencrypt_email: "devops@{{ semsar_domain }}"

# Ports internes (identiques à scripts/dev-mesh-up.sh).
bff_port: 8099

# Un rôle PostgreSQL + schéma par service disposant d'un services/<x>/db/schema.sql
# (le service `search` n'a pas de base propre : projections OpenSearch uniquement).
semsar_db_roles:
  - identity
  - notification
  - analytics
  - contract
  - legal
  - payment
  - billing
  - catalog
  - marketplace
  - directory
  - listing
  - crm
  - geo
  - messaging
  - trust_safety
  - agency
  - audit
  - transactions
  - buyer
  - programs
  - staymanager
  - rental
  - commission
  - selling
  - translation
  - design3d

# URLs inter-services diffusées à tout le mesh via /etc/semsar/secrets.env
# (identiques à scripts/dev-mesh-up.sh, 127.0.0.1 uniquement). Source unique :
# le gabarit `secrets.env.j2` les rend depuis cette table, et la complétion du
# fichier existant (roles/base) y ajoute les entrées manquantes — un service
# ajouté après la première exécution serait sinon injoignable depuis le BFF
# (404 silencieux sur toutes ses routes), le fichier n'étant jamais réécrit.
semsar_service_urls:
  IDENTITY_URL: http://localhost:8501
  NOTIFICATION_URL: http://localhost:8502
  ANALYTICS_URL: http://localhost:8504
  CONTRACT_URL: http://localhost:8505
  LEGAL_URL: http://localhost:8506
  PAYMENT_URL: http://localhost:8507
  BILLING_URL: http://localhost:8508
  CATALOG_URL: http://localhost:8009
  MARKETPLACE_URL: http://localhost:8010
  DIRECTORY_URL: http://localhost:8011
  LISTING_URL: http://localhost:8012
  CRM_URL: http://localhost:8013
  SEARCH_URL: http://localhost:8103
  GEO_URL: http://localhost:8509
  MESSAGING_URL: http://localhost:8510
  TRUST_SAFETY_URL: http://localhost:8511
  AGENCY_URL: http://localhost:8512
  AUDIT_URL: http://localhost:8513
  TRANSACTIONS_URL: http://localhost:8514
  BUYER_URL: http://localhost:8515
  PROGRAMS_URL: http://localhost:8516
  STAYMANAGER_URL: http://localhost:8517
  RENTAL_URL: http://localhost:8518
  COMMISSION_URL: http://localhost:8519
  SELLING_URL: http://localhost:8520
  DESIGN3D_URL: http://localhost:8526

