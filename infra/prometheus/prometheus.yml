global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques dérivées des traces (OTel Collector)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # BFF / gateway (métriques RED via /metrics)
  # host.docker.internal permet d'atteindre un process natif sur l'hôte.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Gabarit pour chaque service FastAPI (à dupliquer lors des extractions)
  # - job_name: identity
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:8001"]
