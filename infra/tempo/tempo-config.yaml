# Backend de traces local. Le collecteur OTel exportait ses spans vers `debug`
# (stdout) : ils arrivaient bien, mais n'étaient consultables nulle part.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
