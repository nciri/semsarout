[project]
name = "semsar-events"
version = "0.1.0"
description = "SemsarOut — outbox transactionnel, publication RabbitMQ, consumers idempotents."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "pika>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["semsar_events"]
