[project]
name = "semsar-search"
version = "0.1.0"
description = "SemsarOut — projection de recherche OpenSearch (index biens + requêtes)."
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["semsar_search"]
