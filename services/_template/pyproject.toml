[project]
name = "semsar-service-template"
version = "0.1.0"
description = "Gabarit de service FastAPI SemsarOut."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-fastapi-instrumentator>=7.0",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "semsar-common",
    "semsar-auth",
    "semsar-events",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
