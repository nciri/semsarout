[project]
name = "semsar-contract"
version = "0.1.0"
description = "SemsarOut — service contract (modèles, contrats, fusion, finalisation PDF)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-fastapi-instrumentator>=7.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "bleach>=6.0",
    "xhtml2pdf>=0.2.11",
    "semsar-common",
    "semsar-auth",
    "semsar-events",
    "semsar-storage",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
