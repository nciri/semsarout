[project]
name = "semsar-matching"
version = "0.1.0"
description = "M3a-L3achrane — service matching (compatibilité déterministe, calcul paresseux)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-fastapi-instrumentator>=7.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "semsar-common",
    "semsar-auth",
    "semsar-events",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-sqlalchemy>=0.1", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
