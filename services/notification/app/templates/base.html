<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block subject %}SemsarOut{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:{{ brand.ivory }}; -webkit-text-size-adjust:100%;">
<div style="display:none; max-height:0; overflow:hidden; opacity:0;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{ brand.ivory }};">
  <tr><td align="center" style="padding:28px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0"
           style="width:600px; max-width:100%; background:#ffffff; border:1px solid {{ brand.border }}; border-radius:14px; overflow:hidden;">

      <!-- Header -->
      <tr><td style="background:{{ brand.dark }}; padding:22px 32px;">
        <span style="font-family:Georgia,'Times New Roman',serif; font-size:22px; font-weight:bold; letter-spacing:.3px; color:#ffffff;">
          Semsar<span style="color:{{ brand.gold }};">Out</span>
        </span>
        <span style="float:right; font-family:Arial,Helvetica,sans-serif; font-size:11px; color:#9aa4b2; text-transform:uppercase; letter-spacing:1px; padding-top:8px;">Immobilier</span>
      </td></tr>
      <tr><td style="height:4px; background:{{ brand.gold }}; line-height:4px; font-size:0;">&nbsp;</td></tr>

      <!-- Content -->
      <tr><td style="padding:34px 32px 12px 32px; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.6; color:{{ brand.text }};">
        {% block content %}{% endblock %}
      </td></tr>

      <!-- Footer -->
      <tr><td style="padding:22px 32px 30px 32px; border-top:1px solid {{ brand.border }};
                     font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.6; color:{{ brand.muted }};">
        <p style="margin:0 0 6px 0;">{{ app.name }} — la plateforme immobilière du Maroc.</p>
        <p style="margin:0;">Cet email vous a été envoyé automatiquement, merci de ne pas y répondre directement.
           © {{ app.year }} {{ app.name }}.</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
