[project]
name = "semsar-search"
version = "0.1.0"
description = "SemsarOut — service search (projection OpenSearch : indexation + requêtes)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-fastapi-instrumentator>=7.0",
    "semsar-common",
    "semsar-events",
    "semsar-search",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
