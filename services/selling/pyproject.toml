[project]
name = "semsar-service-selling"
version = "0.1.0"
description = "Flux vente médiée SemsarOut (demande d'achat → offre → compromis e-signé)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110", "uvicorn[standard]>=0.29",
    "prometheus-fastapi-instrumentator>=7.0", "SQLAlchemy>=2.0", "psycopg[binary]>=3.1",
    "httpx>=0.27", "semsar-common", "semsar-auth", "semsar-events", "semsar-signing",
    "xhtml2pdf>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
